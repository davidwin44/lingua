[package]
name = "lingua-desktop"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Windows installer and launcher for Lingua"
license-file = "../LICENSE"
publish = false

[[bin]]
name = "lingua"
path = "src/main.rs"

[dependencies]
include_dir = "0.7"
tiny_http = "0.12"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
